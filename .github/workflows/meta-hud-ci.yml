# Meta HUD CI — safe, non-live validation for the hardware-validation
# candidate and Meta Connected Runtime Phase A. Runs on pushes and PRs
# touching this repository's code.
#
# HARD RULES:
#   - No live backend calls (no test:smoke, no live scan-identify,
#     no live /api/analyze).
#   - No deployment of any kind.
#   - No secrets are required or used.

name: meta-hud-ci

on:
  push:
    branches:
      - 'feature/**'
      - 'phase-**'
      - 'audit/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install (locked)
        run: npm ci

      - name: Verify MediaPipe model assets
        run: npm run verify:models

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Simulator (LOCAL QA) build
        run: npm run build:simulator

      - name: Static tests
        run: npm run test:static

      - name: Contract tests
        run: npm run test:contract

      - name: TextScan tests (mocked)
        run: npm run test:textscan

      - name: Security tests
        run: npm run test:security

      - name: Bridge lifecycle tests
        run: npm run test:bridge

      - name: Privacy and containment tests
        run: npm run test:privacy

      - name: Production artifact assertion
        run: npm run verify:artifacts

      # Source half of the deployment-drift guard: the behavioural
      # invariants that have regressed before (P2-01 grouping,
      # P3-04 Save idempotency, P2-05 schema completeness). The live
      # half needs staging secrets and runs in
      # wearable-deploy-drift.yml instead, because this workflow's
      # hard rule is no secrets and no live backend calls.
      - name: Wearable contract locks (source-only drift guard)
        run: npm run test:drift-guard

      - name: Companion protocol tests
        run: npm run test:companion-protocol

      - name: Companion pairing tests
        run: npm run test:companion-pairing

      - name: Companion state-machine tests
        run: npm run test:companion-statemachine

      - name: Companion result-contract tests
        run: npm run test:companion-result

      - name: Companion runtime/transport tests
        run: npm run test:companion-reconnect

      - name: Install Chromium for browser suites
        run: npx playwright-core install --with-deps chromium

      - name: Existing browser smoke
        run: npm run browser:smoke

      - name: Companion browser scenarios
        run: npm run browser:companion -- scenarios

      - name: Companion browser loops
        run: npm run browser:companion -- loops
